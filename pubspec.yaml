name: scholar_wallet
description: Scholar Wallet - allowance distribution & receipt tracking for scholars.
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.5   # push notifications (FCM)
  cloud_firestore: ^5.5.0
  supabase_flutter: ^2.8.0

  # Biometrics: real fingerprint enrollment + verification
  local_auth: ^2.3.0

  # QR: admin issues a QR per payout, scholar scans to confirm receipt
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # Utils
  provider: ^6.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  google_fonts: ^6.3.3
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^4.0.2
  lottie: ^3.3.3
  skeletonizer: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  android: true
  ios: false
  web: true
  color: "#F5F7FA"
  color_dark: "#0F141B"
  image: assets/images/logo.png
  image_dark: assets/images/logo.png
  android_12:
    color: "#F5F7FA"
    color_dark: "#0F141B"
    image: assets/images/logo.png
    image_dark: assets/images/logo.png
    icon_background_color: "#1E5AA8"
    icon_background_color_dark: "#14467F"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#1E5AA8"
  adaptive_icon_foreground: assets/images/logo.png
  web:
    generate: true
    image_path: assets/images/logo.png
    background_color: "#F5F7FA"
    theme_color: "#1E5AA8"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
